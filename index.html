<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>YouTube, Summarized</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root {
    --ink: #101319;
    --panel: #171b23;
    --panel-edge: #232936;
    --paper: #ede8e1;
    --muted: #8a8f9c;
    --gold: #e3a73b;
    --gold-dim: #8a6a2c;
    --teal: #3fa796;
    --error: #e2694f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--ink);
    background-image:
      radial-gradient(circle at 15% 10%, rgba(227, 167, 59, 0.06), transparent 40%),
      radial-gradient(circle at 85% 90%, rgba(63, 167, 150, 0.05), transparent 45%);
    color: var(--paper);
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
  }

  .ticket {
    width: 100%;
    max-width: 560px;
    background: var(--panel);
    border: 1px solid var(--panel-edge);
    border-radius: 18px;
    padding: 40px 36px 32px;
    opacity: 0;
    transform: translateY(10px);
    animation: rise 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
  }

  @keyframes rise {
    to { opacity: 1; transform: translateY(0); }
  }

  .lamp {
    width: 34px;
    height: 34px;
    margin-bottom: 18px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 2.1rem;
    line-height: 1.15;
    margin: 0 0 8px;
    letter-spacing: -0.01em;
  }

  h1 em {
    font-style: italic;
    color: var(--gold);
  }

  .sub {
    color: var(--muted);
    font-size: 0.98rem;
    margin: 0 0 28px;
    line-height: 1.5;
    max-width: 42ch;
  }

  .field {
    position: relative;
  }

  input {
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    font-family: 'Inter', sans-serif;
    color: var(--paper);
    background: var(--ink);
    border: 1px solid var(--panel-edge);
    border-radius: 10px;
    outline: none;
    transition: border-color 0.15s ease;
  }

  input:focus {
    border-color: var(--gold-dim);
  }

  input::placeholder { color: #565c6a; }

  .thumb-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-top: 14px;
    height: 0;
    overflow: hidden;
    opacity: 0;
    transition: height 0.25s ease, opacity 0.25s ease, margin 0.25s ease;
  }

  .thumb-row.visible {
    height: 68px;
    opacity: 1;
  }

  .thumb-row img {
    width: 96px;
    height: 68px;
    object-fit: cover;
    border-radius: 8px;
    border: 1px solid var(--panel-edge);
    flex-shrink: 0;
  }

  .thumb-row span {
    color: var(--muted);
    font-size: 0.85rem;
  }

  button {
    width: 100%;
    margin-top: 18px;
    background: var(--gold);
    color: #211605;
    border: none;
    padding: 14px 20px;
    font-size: 15px;
    font-weight: 600;
    font-family: 'Inter', sans-serif;
    border-radius: 10px;
    cursor: pointer;
    transition: transform 0.1s ease, background 0.15s ease;
  }

  button:hover:not(:disabled) { background: #eeb654; }
  button:active:not(:disabled) { transform: scale(0.98); }

  button:disabled {
    background: var(--panel-edge);
    color: var(--muted);
    cursor: default;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .reel {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    border: 2px solid #454b59;
    border-top-color: var(--gold);
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  .error-box {
    display: none;
    margin-top: 16px;
    padding: 12px 14px;
    background: rgba(226, 105, 79, 0.1);
    border: 1px solid rgba(226, 105, 79, 0.3);
    border-radius: 8px;
    color: var(--error);
    font-size: 0.9rem;
  }

  .stub {
    display: none;
    margin-top: 28px;
    padding-top: 24px;
    position: relative;
  }

  .stub::before {
    content: "";
    position: absolute;
    top: 0;
    left: -36px;
    right: -36px;
    border-top: 1.5px dashed var(--panel-edge);
  }

  .stub-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 14px;
  }

  .stub-header .label {
    font-size: 0.78rem;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .badge {
    font-size: 0.72rem;
    color: var(--teal);
    background: rgba(63, 167, 150, 0.12);
    padding: 3px 8px;
    border-radius: 20px;
    display: none;
  }

  .copy-btn {
    width: auto;
    margin: 0;
    padding: 5px 12px;
    font-size: 0.78rem;
    font-weight: 500;
    background: transparent;
    border: 1px solid var(--panel-edge);
    color: var(--muted);
  }

  .copy-btn:hover:not(:disabled) {
    background: var(--panel-edge);
    color: var(--paper);
  }

  #output {
    line-height: 1.65;
    font-size: 0.96rem;
    color: var(--paper);
  }

  #output h1, #output h2, #output h3 {
    font-family: 'Fraunces', serif;
    font-weight: 500;
    font-size: 1.15rem;
    margin: 20px 0 8px;
  }

  #output ul { padding-left: 20px; }
  #output li { margin-bottom: 6px; }
  #output strong { color: var(--gold); font-weight: 600; }
  #output p { margin: 0 0 12px; }

  @media (prefers-reduced-motion: reduce) {
    .ticket { animation: none; opacity: 1; transform: none; }
    .reel { animation: none; }
  }
</style>
</head>
<body>

  <div class="ticket">
    <svg class="lamp" viewBox="0 0 24 24" fill="none">
      <circle cx="12" cy="12" r="9" stroke="#e3a73b" stroke-width="1.4"/>
      <circle cx="12" cy="12" r="3" fill="#e3a73b"/>
    </svg>

    <h1>YouTube, <em>summarized</em></h1>
    <p class="sub">Paste a link. Get the TL;DR, the key points, and the full story — without watching the whole thing.</p>

    <div class="field">
      <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" />
      <div class="thumb-row" id="thumbRow">
        <img id="thumbImg" src="" alt="Video thumbnail" />
        <span>Looks right? Hit summarize.</span>
      </div>
    </div>

    <button id="submitBtn" onclick="generateSummary()">Summarize video</button>
    <div class="error-box" id="error"></div>

    <div class="stub" id="stub">
      <div class="stub-header">
        <span class="label">
          ✦ Summary
          <span class="badge" id="cacheBadge">instant — cached</span>
        </span>
        <button class="copy-btn" id="copyBtn" onclick="copySummary()">Copy</button>
      </div>
      <div id="output"></div>
    </div>
  </div>

<script>
  let currentSummary = "";

  function extractVideoId(url) {
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([\w-]{11})/,
      /(?:youtu\.be\/)([\w-]{11})/,
      /(?:youtube\.com\/shorts\/)([\w-]{11})/
    ];
    for (const p of patterns) {
      const match = url.match(p);
      if (match) return match[1];
    }
    return null;
  }

  document.getElementById("videoUrl").addEventListener("input", (e) => {
    const id = extractVideoId(e.target.value.trim());
    const row = document.getElementById("thumbRow");
    const img = document.getElementById("thumbImg");
    if (id) {
      img.src = `https://img.youtube.com/vi/${id}/mqdefault.jpg`;
      row.classList.add("visible");
    } else {
      row.classList.remove("visible");
    }
  });

  async function generateSummary() {
    const urlInput = document.getElementById("videoUrl").value.trim();
    const outputDiv = document.getElementById("output");
    const errorDiv = document.getElementById("error");
    const stub = document.getElementById("stub");
    const badge = document.getElementById("cacheBadge");
    const btn = document.getElementById("submitBtn");

    errorDiv.style.display = "none";
    errorDiv.innerText = "";

    if (!urlInput || !extractVideoId(urlInput)) {
      errorDiv.innerText = "That doesn't look like a YouTube link — double check and try again.";
      errorDiv.style.display = "block";
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<span class="reel"></span> Summarizing…';
    stub.style.display = "none";

    try {
      const response = await fetch("https://youtube-summarizer-jdvf.onrender.com/summarize", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url: urlInput })
      });
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.detail || "Something went wrong on our end.");
      }
      currentSummary = data.summary;
      outputDiv.innerHTML = marked.parse(data.summary);
      badge.style.display = data.cached ? "inline-block" : "none";
      stub.style.display = "block";
    } catch (err) {
      errorDiv.innerText = err.message;
      errorDiv.style.display = "block";
    } finally {
      btn.disabled = false;
      btn.innerText = "Summarize video";
    }
  }

  function copySummary() {
    if (!currentSummary) return;
    navigator.clipboard.writeText(currentSummary);
    const btn = document.getElementById("copyBtn");
    const original = btn.innerText;
    btn.innerText = "Copied";
    setTimeout(() => { btn.innerText = original; }, 1500);
  }

  document.getElementById("videoUrl").addEventListener("keydown", (e) => {
    if (e.key === "Enter") generateSummary();
  });
</script>
</body>
</html>
