<style>
  :root {
    --ink: #faf6ea; --panel: #fffdf6; --panel-edge: #d8cfae;
    --paper: #2b3a55; --muted: #8a8368; --gold: #f2d43e; --gold-dim: #c7ae4a;
    --teal: #4a7c3f; --error: #b23a2e; --margin: #c0504d;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--ink);
    color: var(--paper); font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    display: flex; flex-direction: column; align-items: center; padding: 32px 20px;
  }
  .wrap { width: 100%; max-width: 560px; }
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 12px; font-size: 0.85rem; color: var(--muted); min-height: 24px;
  }
  .topbar a, .topbar button {
    background: none; border: none; color: var(--muted); font-size: 0.85rem;
    cursor: pointer; padding: 0; width: auto; margin: 0; font-family: 'Inter', sans-serif;
  }
  .topbar a:hover, .topbar button:hover { color: var(--paper); }
  .ticket, .auth-card {
    position: relative;
    background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px;
    padding: 40px 36px 32px 68px;
    background-image: repeating-linear-gradient(var(--panel) 0px, var(--panel) 27px, var(--panel-edge) 28px);
    box-shadow: 0 1px 3px rgba(43,58,85,0.08), 0 8px 20px rgba(43,58,85,0.06);
    opacity: 0; transform: translateY(10px);
    animation: rise 0.6s cubic-bezier(0.16,1,0.3,1) forwards;
  }
  .ticket::before, .auth-card::before {
    content: ""; position: absolute; left: 48px; top: 0; bottom: 0; width: 1.5px;
    background: rgba(192,80,77,0.35);
  }
  @keyframes rise { to { opacity: 1; transform: translateY(0); } }
  .lamp { width: 34px; height: 34px; margin-bottom: 18px; }
  h1 { font-family: 'Caveat', cursive; font-weight: 700; font-size: 2.6rem; line-height: 1; margin: 0 0 10px; }
  h1 em { font-style: normal; background: var(--gold); padding: 0 6px; border-radius: 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
  .sub { color: var(--muted); font-size: 0.98rem; margin: 0 0 28px; line-height: 1.5; max-width: 42ch; }
  .field { position: relative; margin-bottom: 12px; }
  input {
    width: 100%; padding: 14px 16px; font-size: 16px; font-family: 'Inter', sans-serif;
    color: var(--paper); background: var(--ink); border: 1px solid var(--panel-edge);
    border-radius: 6px; outline: none; transition: border-color 0.15s ease;
  }
  input:focus { border-color: var(--gold-dim); }
  input::placeholder { color: #a39c7f; }

  #videoUrl { padding-right: 40px; }
  .clear-btn {
    position: absolute;
    right: 8px;
    top: 15px;
    width: auto;
    margin: 0;
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    line-height: 1;
    cursor: pointer;
    padding: 6px;
    border-radius: 50%;
    display: none;
  }
  .clear-btn:hover { color: var(--paper); background: var(--panel-edge); }
  .thumb-row {
    display: flex; align-items: center; gap: 12px; margin-top: 14px; height: 0;
    overflow: hidden; opacity: 0; transition: height 0.25s ease, opacity 0.25s ease;
  }
  .thumb-row.visible { height: 68px; opacity: 1; }
  .thumb-row img { width: 96px; height: 68px; object-fit: cover; border-radius: 8px; border: 1px solid var(--panel-edge); flex-shrink: 0; }
  .thumb-row span { color: var(--muted); font-size: 0.85rem; }
  button.primary {
    width: 100%; margin-top: 6px; background: var(--gold); color: #211605; border: none;
    padding: 14px 20px; font-size: 15px; font-weight: 600; font-family: 'Inter', sans-serif;
    border-radius: 10px; cursor: pointer; transition: transform 0.1s ease, background 0.15s ease;
  }
  button.primary:hover:not(:disabled) { background: #e6c93a; }
  button.primary:active:not(:disabled) { transform: scale(0.98); }
  button.primary:disabled {
    background: var(--panel-edge); color: var(--muted); cursor: default;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .link-btn {
    width: 100%; margin-top: 14px; background: none; border: none; color: var(--muted);
    font-size: 0.85rem; cursor: pointer; font-family: 'Inter', sans-serif; text-align: center;
  }
  .link-btn:hover { color: var(--paper); }
  .divider { display: flex; align-items: center; gap: 12px; margin: 18px 0 14px; color: var(--muted); font-size: 0.78rem; }
  .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: var(--panel-edge); }
  .google-btn {
    width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
    background: var(--ink); color: var(--paper); border: 1px solid var(--panel-edge);
    padding: 12px 20px; font-size: 14px; font-weight: 500; font-family: 'Inter', sans-serif;
    border-radius: 10px; cursor: pointer; transition: background 0.15s ease;
  }
  .google-btn:hover { background: var(--panel-edge); }
  .reel { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #cbb98a; border-top-color: var(--gold-dim); animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error-box, .info-box {
    display: none; margin-top: 16px; padding: 12px 14px; border-radius: 8px; font-size: 0.9rem;
  }
  .error-box { background: rgba(178,58,46,0.08); border: 1px solid rgba(178,58,46,0.25); color: var(--error); }
  .info-box { background: rgba(74,124,63,0.08); border: 1px solid rgba(74,124,63,0.25); color: var(--teal); }
  .stub { display: none; margin-top: 28px; padding-top: 24px; position: relative; }
  .stub::before { content: ""; position: absolute; top: 0; left: -68px; right: -36px; border-top: 1.5px dashed var(--panel-edge); }
  .stub-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  .stub-header .label { font-size: 0.78rem; color: var(--muted); display: flex; align-items: center; gap: 6px; }
  .badge { font-size: 0.72rem; color: var(--teal); background: rgba(74,124,63,0.12); padding: 3px 8px; border-radius: 20px; display: none; }
  .copy-btn {
    width: auto; margin: 0; padding: 5px 12px; font-size: 0.78rem; font-weight: 500;
    background: transparent; border: 1px solid var(--panel-edge); color: var(--muted); border-radius: 10px; cursor: pointer;
  }
  .copy-btn:hover { background: var(--panel-edge); color: var(--paper); }
  #output { line-height: 1.65; font-size: 0.96rem; color: var(--paper); }
  #output h1, #output h2, #output h3 {
    font-family: 'Inter', sans-serif; font-weight: 600; font-size: 1.05rem; margin: 22px 0 10px;
    padding-bottom: 4px; border-bottom: 2px solid var(--gold);
  }
  #output ul { padding-left: 20px; }
  #output li { margin-bottom: 6px; }
  #output strong { background: rgba(242,212,62,0.4); font-weight: 600; padding: 0 2px; }
  #output p { margin: 0 0 12px; }
  .history-panel { margin-top: 14px; }
  .history-controls { display: flex; gap: 8px; margin-bottom: 4px; }
  .history-controls input { flex: 1; min-width: 0; }
  #historySort {
    font-size: 13px; padding: 0 10px; font-family: 'Inter', sans-serif;
    color: var(--paper); background: var(--ink); border: 1px solid var(--panel-edge);
    border-radius: 10px; outline: none; cursor: pointer;
  }
  #historySearch { margin-bottom: 4px; font-size: 14px; padding: 11px 14px; }
  .history-list { min-height: 0; }
  .history-item {
    display: flex; align-items: center; gap: 8px; padding: 12px 0; border-bottom: 1px solid var(--panel-edge);
  }
  .history-item:last-child { border-bottom: none; }
  .history-item-main { display: flex; gap: 12px; flex: 1; min-width: 0; cursor: pointer; }
  .history-item img, .history-thumb-placeholder {
    width: 88px; height: 50px; object-fit: cover; border-radius: 6px;
    border: 1px solid var(--panel-edge); flex-shrink: 0; background: var(--ink);
  }
  .history-meta { min-width: 0; }
  .h-title {
    font-size: 0.9rem; font-weight: 500; color: var(--paper);
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box;
    -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .h-channel { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
  .history-item .date { font-size: 0.72rem; color: var(--muted); margin-top: 3px; }
  .history-item:hover .h-title { color: var(--gold-dim); }
  .delete-btn {
    width: auto; margin: 0; background: none; border: none; color: var(--muted);
    font-size: 0.9rem; cursor: pointer; padding: 6px 10px; border-radius: 6px; flex-shrink: 0;
  }
  .delete-btn:hover { color: var(--error); background: rgba(178,58,46,0.08); }
  .ts-link {
    color: var(--paper); text-decoration: none; font-weight: 600;
    background: var(--gold); padding: 1px 5px; border-radius: 2px;
  }
  .ts-link:hover { background: var(--gold-dim); }
  .empty-note { color: var(--muted); font-size: 0.9rem; text-align: center; padding: 20px 0; }
  @media (prefers-reduced-motion: reduce) { .ticket, .auth-card { animation: none; opacity: 1; transform: none; } .reel { animation: none; } }

  @media (max-width: 420px) {
    body { padding: 20px 12px; }
    .ticket, .auth-card { padding: 28px 20px 24px 52px; border-radius: 8px; }
    .ticket::before, .auth-card::before { left: 34px; }
    h1 { font-size: 2.1rem; }
    .sub { font-size: 0.92rem; margin-bottom: 22px; }
    .stub::before { left: -52px; right: -20px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar" id="topbar"></div>

  <!-- Auth card: shown when logged out -->
  <div class="auth-card" id="authCard">
    <svg class="lamp" viewBox="0 0 24 24" fill="none"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z" stroke="#2b3a55" stroke-width="1.4" stroke-linejoin="round"/><path d="M14 7l3 3" stroke="#f2d43e" stroke-width="1.4"/></svg>
    <h1 id="authTitle">Sign <em>in</em></h1>
    <p class="sub" id="authSub">Sign in to summarize videos and keep a history of what you've watched.</p>
    <div class="field"><input type="email" id="authEmail" placeholder="you@example.com" autocomplete="email" /></div>
    <div class="field"><input type="password" id="authPassword" placeholder="Password" autocomplete="current-password" /></div>
    <button class="primary" id="authSubmitBtn" onclick="submitAuth()">Sign in</button>

    <div class="divider"><span>or</span></div>

    <button class="google-btn" onclick="signInWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18">
        <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.9c1.7-1.57 2.7-3.88 2.7-6.62z"/>
        <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.9-2.26c-.8.54-1.84.86-3.06.86-2.35 0-4.34-1.59-5.05-3.72H.98v2.33A9 9 0 0 0 9 18z"/>
        <path fill="#FBBC05" d="M3.95 10.7A5.4 5.4 0 0 1 3.67 9c0-.59.1-1.17.28-1.7V4.97H.98A9 9 0 0 0 0 9c0 1.45.35 2.83.98 4.03l2.97-2.33z"/>
        <path fill="#EA4335" d="M9 3.58c1.32 0 2.51.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .98 4.97l2.97 2.33C4.66 5.17 6.65 3.58 9 3.58z"/>
      </svg>
      Continue with Google
    </button>

    <button class="link-btn" onclick="toggleAuthMode()" id="authToggleBtn">Don't have an account? Sign up</button>
    <div class="error-box" id="authError"></div>
    <div class="info-box" id="authInfo"></div>
  </div>

  <!-- Main app: shown when logged in -->
  <div class="ticket" id="appCard" style="display:none;">
    <svg class="lamp" viewBox="0 0 24 24" fill="none"><path d="M4 20l1-4L16 5l3 3L8 19l-4 1z" stroke="#2b3a55" stroke-width="1.4" stroke-linejoin="round"/><path d="M14 7l3 3" stroke="#f2d43e" stroke-width="1.4"/></svg>
    <h1>YouTube, <em>summarized</em></h1>
    <p class="sub">Paste a link. Get the TL;DR, the key points, and the full story — without watching the whole thing.</p>

    <div class="field">
      <input type="text" id="videoUrl" placeholder="https://www.youtube.com/watch?v=..." autocomplete="off" />
      <button type="button" id="clearBtn" class="clear-btn" title="Clear" onclick="clearVideoUrl()">✕</button>
      <div class="thumb-row" id="thumbRow">
        <img id="thumbImg" src="" alt="Video thumbnail" />
        <span>Looks right? Hit summarize.</span>
      </div>
    </div>

    <button class="primary" id="submitBtn" onclick="generateSummary()">Summarize video</button>
    <button class="link-btn" onclick="toggleHistory()" id="historyToggleBtn">View history</button>
    <div class="error-box" id="error"></div>

    <div class="history-panel" id="historyPanel" style="display:none;">
      <div class="history-controls">
        <input type="text" id="historySearch" placeholder="Search your history…" autocomplete="off" />
        <select id="historySort">
          <option value="desc">Newest first</option>
          <option value="asc">Oldest first</option>
        </select>
      </div>
      <div class="error-box" id="historyError"></div>
      <div class="history-list" id="historyList"></div>
    </div>

    <div class="stub" id="stub">
      <div class="stub-header">
        <span class="label">✦ Summary <span class="badge" id="cacheBadge">instant — cached</span></span>
        <button class="copy-btn" id="copyBtn" onclick="copySummary()">Copy</button>
      </div>
      <div id="output"></div>
    </div>
  </div>

</div>

<script>
  // ---- Config: fill in your own project values ----
  const SUPABASE_URL = "https://lbvmcqfdatesxvbxgcdz.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_Ek3H3fYALmp7kDgYTNvBrw_BNvR1ppJ";
  const API_BASE = "https://youtube-summarizer-jdvf.onrender.com";

  const { createClient } = supabase;
  const sb = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let currentSummary = "";
  let authMode = "signin"; // or "signup"

  // ---- Auth ----
  function toggleAuthMode() {
    authMode = authMode === "signin" ? "signup" : "signin";
    document.getElementById("authTitle").innerHTML = authMode === "signin" ? "Sign <em>in</em>" : "Sign <em>up</em>";
    document.getElementById("authSubmitBtn").innerText = authMode === "signin" ? "Sign in" : "Create account";
    document.getElementById("authToggleBtn").innerText = authMode === "signin"
      ? "Don't have an account? Sign up" : "Already have an account? Sign in";
    document.getElementById("authError").style.display = "none";
    document.getElementById("authInfo").style.display = "none";
  }

  async function submitAuth() {
    const email = document.getElementById("authEmail").value.trim();
    const password = document.getElementById("authPassword").value;
    const errorBox = document.getElementById("authError");
    const infoBox = document.getElementById("authInfo");
    errorBox.style.display = "none";
    infoBox.style.display = "none";

    if (!email || !password) {
      errorBox.innerText = "Enter both an email and a password.";
      errorBox.style.display = "block";
      return;
    }

    const { data, error } = authMode === "signin"
      ? await sb.auth.signInWithPassword({ email, password })
      : await sb.auth.signUp({ email, password });

    if (error) {
      errorBox.innerText = error.message;
      errorBox.style.display = "block";
      return;
    }

    if (authMode === "signup" && !data.session) {
      infoBox.innerText = "Check your email to confirm your account, then sign in.";
      infoBox.style.display = "block";
      return;
    }
    renderAuthedState();
  }

  async function signInWithGoogle() {
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + window.location.pathname }
    });
    if (error) {
      const errorBox = document.getElementById("authError");
      errorBox.innerText = error.message;
      errorBox.style.display = "block";
    }
  }

  async function signOut() {
    await sb.auth.signOut();
    renderAuthedState();
  }

  async function getToken() {
    const { data } = await sb.auth.getSession();
    return data.session ? data.session.access_token : null;
  }

  async function renderAuthedState() {
    const { data } = await sb.auth.getSession();
    const topbar = document.getElementById("topbar");
    if (data.session) {
      document.getElementById("authCard").style.display = "none";
      document.getElementById("appCard").style.display = "block";
      topbar.innerHTML = `<span>${data.session.user.email}</span><button onclick="signOut()">Sign out</button>`;
    } else {
      document.getElementById("authCard").style.display = "block";
      document.getElementById("appCard").style.display = "none";
      topbar.innerHTML = "";
    }
    handleIncomingUrl(!!data.session);
  }

  // Pre-fills (and optionally auto-runs) a summary when arriving via
  // ?url=<video>&autorun=1 — how the browser extension hands off a video
  // without the user copy-pasting anything.
  let autoRunHandled = false;
  function handleIncomingUrl(isLoggedIn) {
    const params = new URLSearchParams(window.location.search);
    const incomingUrl = params.get("url");
    if (!incomingUrl) return;

    const input = document.getElementById("videoUrl");
    if (!input.value) {
      input.value = incomingUrl;
      input.dispatchEvent(new Event("input"));
    }

    if (isLoggedIn && params.get("autorun") === "1" && !autoRunHandled) {
      autoRunHandled = true;
      // Clean the URL so refreshing the tab later doesn't re-trigger this.
      window.history.replaceState({}, document.title, window.location.pathname);
      generateSummary();
    }
  }

  sb.auth.onAuthStateChange(() => renderAuthedState());
  renderAuthedState();

  // ---- Thumbnail preview ----
  function extractVideoId(url) {
    const patterns = [
      /(?:youtube\.com\/watch\?v=)([\w-]{11})/,
      /(?:youtu\.be\/)([\w-]{11})/,
      /(?:youtube\.com\/shorts\/)([\w-]{11})/
    ];
    for (const p of patterns) { const m = url.match(p); if (m) return m[1]; }
    return null;
  }

  document.getElementById("videoUrl").addEventListener("input", (e) => {
    const value = e.target.value.trim();
    const id = extractVideoId(value);
    const row = document.getElementById("thumbRow");
    const img = document.getElementById("thumbImg");
    if (id) { img.src = `https://img.youtube.com/vi/${id}/mqdefault.jpg`; row.classList.add("visible"); }
    else { row.classList.remove("visible"); }
    document.getElementById("clearBtn").style.display = value ? "block" : "none";
  });

  function clearVideoUrl() {
    const input = document.getElementById("videoUrl");
    input.value = "";
    input.focus();
    document.getElementById("thumbRow").classList.remove("visible");
    document.getElementById("clearBtn").style.display = "none";
    document.getElementById("error").style.display = "none";
  }

  document.getElementById("videoUrl").addEventListener("keydown", (e) => {
    if (e.key === "Enter") generateSummary();
  });

  // ---- Chapter timestamps → clickable links ----
  // The model outputs plain "MM:SS — description" text; this walks the
  // rendered output and turns those timestamps into links that jump to
  // that exact second in the video.
  function linkifyTimestamps(container, videoId) {
    if (!videoId) return;
    const tsPattern = /\b(?:(\d{1,2}):)?(\d{1,2}):(\d{2})\b/g;
    const walker = document.createTreeWalker(container, NodeFilter.SHOW_TEXT);
    const nodes = [];
    let node;
    while ((node = walker.nextNode())) nodes.push(node);

    nodes.forEach((textNode) => {
      const text = textNode.nodeValue;
      tsPattern.lastIndex = 0;
      if (!tsPattern.test(text)) return;
      tsPattern.lastIndex = 0;

      const frag = document.createDocumentFragment();
      let lastIndex = 0;
      let match;
      while ((match = tsPattern.exec(text)) !== null) {
        const [full, hh, mm, ss] = match;
        const totalSeconds = (hh ? parseInt(hh, 10) * 3600 : 0) + parseInt(mm, 10) * 60 + parseInt(ss, 10);
        frag.appendChild(document.createTextNode(text.slice(lastIndex, match.index)));
        const link = document.createElement("a");
        link.href = `https://www.youtube.com/watch?v=${videoId}&t=${totalSeconds}s`;
        link.target = "_blank";
        link.rel = "noopener";
        link.className = "ts-link";
        link.textContent = full;
        frag.appendChild(link);
        lastIndex = match.index + full.length;
      }
      frag.appendChild(document.createTextNode(text.slice(lastIndex)));
      textNode.parentNode.replaceChild(frag, textNode);
    });
  }

  // ---- Summarize (streamed) ----
  let currentVideoId = null;

  async function generateSummary() {
    const urlInput = document.getElementById("videoUrl").value.trim();
    const outputDiv = document.getElementById("output");
    const errorDiv = document.getElementById("error");
    const stub = document.getElementById("stub");
    const badge = document.getElementById("cacheBadge");
    const btn = document.getElementById("submitBtn");

    errorDiv.style.display = "none";
    document.getElementById("historyPanel").style.display = "none";
    historyVisible = false;
    document.getElementById("historyToggleBtn").innerText = "View history";

    if (!urlInput || !extractVideoId(urlInput)) {
      errorDiv.innerText = "That doesn't look like a YouTube link — double check and try again.";
      errorDiv.style.display = "block";
      return;
    }

    const token = await getToken();
    if (!token) { renderAuthedState(); return; }

    currentVideoId = extractVideoId(urlInput);
    btn.disabled = true;
    btn.innerHTML = '<span class="reel"></span> Summarizing…';
    badge.style.display = "none";
    outputDiv.innerHTML = "";
    currentSummary = "";
    stub.style.display = "block";

    // Free-tier hosting spins the backend down after inactivity — the
    // first request after idle time can take 30-60s just to wake it up.
    // Without this, that delay looks identical to the app being stuck.
    const coldStartTimer = setTimeout(() => {
      btn.innerHTML = '<span class="reel"></span> Waking up the server…';
    }, 4000);

    try {
      const response = await fetch(`${API_BASE}/summarize`, {
        method: "POST",
        headers: { "Content-Type": "application/json", "Authorization": `Bearer ${token}` },
        body: JSON.stringify({ url: urlInput })
      });

      clearTimeout(coldStartTimer);
      btn.innerHTML = '<span class="reel"></span> Summarizing…';

      if (!response.ok) {
        let detail = "Something went wrong on our end.";
        try { const data = await response.json(); detail = data.detail || detail; } catch (_) {}
        throw new Error(detail);
      }

      const isCached = response.headers.get("X-Cache") === "HIT";
      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        currentSummary = buffer;
        outputDiv.innerHTML = marked.parse(buffer);
      }

      linkifyTimestamps(outputDiv, currentVideoId);
      badge.style.display = isCached ? "inline-block" : "none";
    } catch (err) {
      clearTimeout(coldStartTimer);
      errorDiv.innerText = err.message;
      errorDiv.style.display = "block";
      stub.style.display = "none";
    } finally {
      btn.disabled = false;
      btn.innerText = "Summarize video";
    }
  }

  function copySummary() {
    if (!currentSummary) return;
    navigator.clipboard.writeText(currentSummary);
    const btn = document.getElementById("copyBtn");
    const original = btn.innerText;
    btn.innerText = "Copied";
    setTimeout(() => { btn.innerText = original; }, 1500);
  }

  // ---- History ----
  let historyVisible = false;
  let historyData = [];
  let searchDebounceTimer = null;

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }

  async function toggleHistory() {
    const panel = document.getElementById("historyPanel");
    const stub = document.getElementById("stub");
    historyVisible = !historyVisible;
    document.getElementById("historyToggleBtn").innerText = historyVisible ? "Hide history" : "View history";

    if (!historyVisible) { panel.style.display = "none"; return; }

    stub.style.display = "none";
    document.getElementById("historySearch").value = "";
    document.getElementById("historySort").value = "desc";
    document.getElementById("historyError").style.display = "none";
    panel.style.display = "block";
    await loadHistory();
  }

  document.getElementById("historySearch").addEventListener("input", (e) => {
    clearTimeout(searchDebounceTimer);
    const q = e.target.value.trim();
    searchDebounceTimer = setTimeout(() => loadHistory(q), 300);
  });

  document.getElementById("historySort").addEventListener("change", () => {
    const q = document.getElementById("historySearch").value.trim();
    loadHistory(q);
  });

  async function loadHistory(query = "") {
    const list = document.getElementById("historyList");
    const sort = document.getElementById("historySort").value;
    list.innerHTML = '<div class="empty-note">Loading…</div>';

    const token = await getToken();
    if (!token) { renderAuthedState(); return; }

    try {
      const params = new URLSearchParams({ sort });
      if (query) params.set("q", query);
      const response = await fetch(`${API_BASE}/history?${params.toString()}`, {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "Couldn't load history.");

      if (!data.history.length) {
        list.innerHTML = `<div class="empty-note">${query ? "No matches found." : "No summaries yet — paste a link above to get started."}</div>`;
        historyData = [];
        return;
      }

      historyData = data.history;
      list.innerHTML = historyData.map((item, i) => `
        <div class="history-item" data-index="${i}">
          <div class="history-item-main" onclick="showHistoryItem(${i})">
            ${item.thumbnail_url
              ? `<img src="${escapeHtml(item.thumbnail_url)}" alt="" onerror="this.replaceWith(Object.assign(document.createElement('div'), {className: 'history-thumb-placeholder'}))" />`
              : `<div class="history-thumb-placeholder"></div>`}
            <div class="history-meta">
              <div class="h-title">${escapeHtml(item.title) || escapeHtml(item.video_url)}</div>
              <div class="h-channel">${escapeHtml(item.channel_name) || ''}</div>
              <div class="date">Summarized ${new Date(item.created_at).toLocaleDateString()}</div>
            </div>
          </div>
          <button class="delete-btn" onclick="deleteHistoryItem(event, '${item.id}', ${i})" title="Delete">✕</button>
        </div>
      `).join("");
    } catch (err) {
      list.innerHTML = `<div class="empty-note">${err.message}</div>`;
    }
  }

  async function deleteHistoryItem(event, id, index) {
    event.stopPropagation();
    const errorBox = document.getElementById("historyError");
    errorBox.style.display = "none";

    const token = await getToken();
    if (!token) { renderAuthedState(); return; }

    try {
      const response = await fetch(`${API_BASE}/history/${id}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (!response.ok) {
        const data = await response.json().catch(() => ({}));
        throw new Error(data.detail || "Couldn't delete this item.");
      }
      const el = document.querySelector(`.history-item[data-index="${index}"]`);
      if (el) el.remove();
    } catch (err) {
      errorBox.innerText = err.message;
      errorBox.style.display = "block";
    }
  }

  function showHistoryItem(index) {
    const item = historyData[index];
    currentSummary = item.summary;
    currentVideoId = extractVideoId(item.video_url);
    const outputDiv = document.getElementById("output");
    outputDiv.innerHTML = marked.parse(item.summary);
    linkifyTimestamps(outputDiv, currentVideoId);
    document.getElementById("cacheBadge").style.display = "none";
    document.getElementById("historyPanel").style.display = "none";
    document.getElementById("stub").style.display = "block";
    historyVisible = false;
    document.getElementById("historyToggleBtn").innerText = "View history";
  }
</script>
</body>
</html>
